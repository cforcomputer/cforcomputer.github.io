<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google-site-verification" content="eh6_NLwsHNHPrLRcBE9AZh-9RWDJiMszGDHSRgveYkc" />

  <meta name="theme-color" content="#ffffff" />

  <title>
    {%- if page.url == "/" -%}
      {{ site.seo_title | default: site.title }}
    {%- elsif page.layout == "post" or page.layout == "project" -%}
      {{ page.title }} · {{ site.author }}
    {%- elsif page.title -%}
      {{ page.title }}
    {%- else -%}
      {{ site.title }}
    {%- endif -%}
  </title>

  {%-seo title=false-%}
  {%-feed_meta-%}
  {%- if page.url == "/" %}
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Person","name":{{ site.author | jsonify }},"url":{{ site.url | jsonify }},
   "description":{{ site.description | jsonify }},
   "sameAs":["https://www.linkedin.com/in/patj","https://github.com/cforcomputer"]}
  </script>
  {%- endif %}

  <link rel="shortcut icon" type="image/x-icon" href="{{ site.favicon | relative_url }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" />
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}" />
  <link rel="stylesheet" href="{{ "/assets/css/substack.css" | relative_url }}" />
  {%- if page.layout == "project" %}
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="{{ "/assets/css/project.css" | relative_url }}" />
  {%- endif %}
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.css" integrity="sha384-OH8qNTHoMMVNVcKdKewlipV4SErXqccxxlg6HC9Cwjr5oZu2AdBej1TndeCirael" crossorigin="anonymous">

  <script src="{{ "/assets/js/instantpage-5.2.0.js" | relative_url }}" type="module"></script>
</head>
